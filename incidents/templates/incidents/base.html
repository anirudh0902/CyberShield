
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CyberShield{% endblock %}</title>
    <style>
        :root {
            --bg: #090e1b;
            --panel: #111a2b;
            --line: #25334a;
            --text: #edf3ff;
            --muted: #91a3bd;
            --blue: #60a5fa;
            --purple: #a78bfa;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, Segoe UI, Arial, sans-serif;
        }
        a { color: var(--blue); text-decoration: none; }
        .topbar {
            display: flex; justify-content: space-between;
            align-items: center; padding: 20px 5%;
            border-bottom: 1px solid var(--line);
            background: #0d1423;
        }
        .brand { font-size: 22px; font-weight: 800; letter-spacing: .4px; }
        .brand span { color: var(--blue); }
        .nav { display: flex; gap: 18px; align-items: center; }
        .container { max-width: 1250px; margin: 35px auto; padding: 0 22px; }
        h1 { margin-bottom: 8px; font-size: 30px; }
        .muted { color: var(--muted); }
        .cards {
            display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 16px; margin: 26px 0;
        }
        .panel, .stat {
            background: var(--panel); border: 1px solid var(--line);
            border-radius: 15px; padding: 20px;
        }
        .stat p { margin: 0; color: var(--muted); font-size: 14px; }
        .stat h2 { margin: 12px 0 0; font-size: 32px; }
        .blue { color: #60a5fa; }
        .red { color: #fb7185; }
        .green { color: #4ade80; }
        .purple { color: var(--purple); }
        .toolbar {
            display: flex; justify-content: space-between;
            align-items: center; flex-wrap: wrap; gap: 12px;
            margin-bottom: 18px;
        }
        input, select, textarea {
            width: 100%; padding: 12px 13px; border-radius: 9px;
            background: #0b1322; color: var(--text);
            border: 1px solid var(--line); font: inherit;
        }
        .filters { display: flex; gap: 10px; flex-wrap: wrap; }
        .filters input { width: 210px; }
        .filters select { width: 155px; }
        .btn {
            display: inline-block; padding: 11px 15px; border-radius: 9px;
            border: 0; cursor: pointer; font-weight: 700; font-size: 13px;
            background: #2563eb; color: white;
        }
        .btn.secondary { background: #243149; color: #dce8ff; }
        .btn.danger { background: #7f1d35; color: #fecdd3; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 760px; }
        th, td {
            padding: 15px 12px; text-align: left;
            border-bottom: 1px solid var(--line); font-size: 13px;
        }
        th { color: var(--muted); font-weight: 600; }
        .pill {
            display: inline-block; padding: 5px 9px; border-radius: 20px;
            font-size: 11px; font-weight: 800; background: #25334a;
        }
        .Critical { background: #4c1727; color: #fda4af; }
        .High { background: #512b19; color: #fdba74; }
        .Medium { background: #423716; color: #fde68a; }
        .Low { background: #153c34; color: #86efac; }
        .actions { display: flex; align-items: center; gap: 10px; }
        .form-grid { display: grid; gap: 18px; }
        .field label { display: block; margin-bottom: 8px; color: #c8d5ea; }
        .field ul { color: #fda4af; }
        .messages { padding: 12px; background: #153c34; border-radius: 8px; }
        .empty { text-align: center; padding: 35px; color: var(--muted); }
        @media (max-width: 750px) {
            .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .topbar { padding: 16px 20px; }
            .nav { gap: 10px; }
            .container { margin: 22px auto; padding: 0 14px; }
            h1 { font-size: 25px; }
        }
        @media (max-width: 430px) {
            .cards { grid-template-columns: 1fr 1fr; gap: 8px; }
            .stat { padding: 13px; }
            .stat h2 { font-size: 25px; }
            .brand { font-size: 18px; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a href="{% url 'dashboard' %}" class="brand">
            ◈ Cyber<span>Shield</span>
        </a>
        {% if user.is_authenticated %}
        <nav class="nav">
            <a href="{% url 'dashboard' %}">Dashboard</a>
            <a href="/api/incidents/">API</a>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button class="btn secondary" type="submit">Logout</button>
            </form>
        </nav>
        {% endif %}
    </header>

    <main class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="messages">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
